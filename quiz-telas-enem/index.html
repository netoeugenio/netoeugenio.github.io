<style>

*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;background:radial-gradient(circle at 0 0,#7839dc,transparent 37%),radial-gradient(circle at 100% 54%,#0084ba,transparent 34%),linear-gradient(145deg,#170e4f,#312083 55%,#1d105f);min-height:100dvh;color:#231b48}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #ffd848;outline-offset:2px}.shell{max-width:650px;padding:15px 14px 40px;margin:auto}.mast{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;color:#fff;font-weight:900;font-size:14px}.mast .brand{display:flex;align-items:center;gap:8px}.brand span{background:#ffe449;color:#271c63;display:grid;place-items:center;border:2px solid white;border-radius:12px;width:37px;height:37px;font-size:20px;transform:rotate(-8deg)}.share{border:1px solid #ffffff60;color:white;background:#ffffff22;border-radius:99px;font-size:12px;font-weight:900;padding:9px}.card{background:white;border:3px solid #fff;border-radius:27px;box-shadow:0 16px 0 #0e083e6c,0 22px 35px #09052e80;overflow:hidden}.banner{background:linear-gradient(127deg,#5930db,#4336bf,#007bd4);padding:28px 21px 25px;color:#fff;position:relative;overflow:hidden}.ribbon{display:inline-block;background:#ffe35e;color:#342073;padding:5px 13px;font-size:12px;font-weight:900;border-radius:100px;text-transform:uppercase;letter-spacing:.5px}.banner h1{font:700 clamp(36px,9vw,55px)/1 Fredoka,sans-serif;margin:13px 0;text-shadow:3px 3px #231065}.banner h1 em{color:#ffdf54;font-style:normal}.banner p{font-size:15px;font-weight:800;max-width:350px;margin:0}.avatars{display:flex;justify-content:center;align-items:end;gap:5px;padding-top:16px}.person{font-size:39px;display:grid;place-items:center;width:54px;height:59px;background:#ffffff24;border:2px solid #ffffff50;border-radius:16px 16px 6px 6px}.person:nth-child(2){transform:translateY(-7px) rotate(-5deg)}.person:nth-child(4){transform:translateY(-5px) rotate(6deg)}.mascot{font-size:40px;animation:bob 2.1s ease-in-out infinite;filter:drop-shadow(2px 3px 0 #201661)}.body{padding:22px 19px}.body h2{font:600 24px Fredoka,sans-serif;margin:0 0 9px}.desc{font-size:14px;color:#766a98;font-weight:700;line-height:1.5;margin:0 0 15px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 18px}.chips span{font-size:12px;background:#f0eaff;border-radius:99px;padding:6px 10px;color:#6840bc;font-weight:900}.line{background:#f5f2ff;border:2px solid #e7defa;border-radius:16px;display:flex;align-items:center;gap:9px;padding:8px;margin-bottom:9px}.avatarBtn{background:#e8e0ff;border:0;border-radius:12px;width:49px;height:49px;font-size:30px;flex:none}.line div{min-width:0;flex:1}.line label{display:block;font-size:10px;color:#7d6d9c;font-weight:900;letter-spacing:.5px;text-transform:uppercase}.line input{border:0;background:transparent;width:100%;color:#20164f;font-size:17px;font-weight:900;outline:0;padding:3px 0}.line input::placeholder{color:#aa9ec7}.checkrow{background:#e9fcf5;border:2px solid #c9f2e2;padding:13px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;margin:17px 0}.checkrow b{font-size:14px}.checkrow small{display:block;color:#578c7e;font-weight:700;font-size:12px}.checkrow input{accent-color:#5841d4;width:23px;height:23px}.btn{border:0;border-radius:16px;background:#ffdd51;color:#211448;font-weight:900;font-size:18px;padding:16px;box-shadow:0 6px #e6aa1d;width:100%;display:block}.btn:active{transform:translateY(4px);box-shadow:0 2px #e6aa1d}.btn.secondary{background:#6543df;color:white;box-shadow:0 6px #3b2799}.btn.light{background:#f1edfb;color:#5f3bbf;box-shadow:none;font-size:14px}.btn:disabled{opacity:.48;cursor:not-allowed;box-shadow:none}.error{font-size:13px;color:#bd2558;font-weight:900;margin:9px 0}.topicgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:23px}.topic{border-radius:14px;background:#ffeaf5;padding:13px;font-weight:900;font-size:12px;min-height:83px}.topic:nth-child(2){background:#fff3d5}.topic:nth-child(3){background:#e4eeff}.topic:nth-child(4){background:#e2fbec}.topic i{display:block;font-style:normal;font-size:24px}.note{font-size:12px;color:#a297b5;text-align:center;line-height:1.5;padding-top:12px}.outside{font-size:12px;text-align:center;color:#ffffffb3;padding:24px 0}.handoff{text-align:center;padding:30px 19px}.handoff .huge{font-size:84px;animation:bob 2s infinite}.handoff h2{font:700 39px/1.07 Fredoka,sans-serif;margin:13px 0;color:#281950}.handoff h2 strong{color:#7038df}.handoff p{font-weight:800;color:#726590;line-height:1.55;margin:13px 0 22px}.handoff .sub{font-size:12px;background:#f1eaff;padding:9px;border-radius:99px;color:#6133be;font-weight:900}.handoff .btn{margin-top:22px}.qbanner{background:linear-gradient(130deg,var(--color),#29247b);padding:19px;color:white}.qtop{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:13px;margin-bottom:9px}.meter{background:#ffffff60;height:9px;border-radius:10px;overflow:hidden;margin-bottom:20px}.meter div{height:100%;background:#ffe05b;transition:width .3s}.qbanner .tag{font-size:12px;font-weight:900;border-radius:50px;background:#fff;color:var(--color);padding:7px 11px;display:inline-block}.qbanner h2{font:600 clamp(25px,6vw,33px)/1.17 Fredoka,sans-serif;margin:15px 0 5px}.timer{background:#ffffff35;border-radius:80px;padding:5px 9px}.timer.low{background:#f42f62}.option{display:flex;align-items:center;gap:11px;border:3px solid #ede9f8;border-radius:17px;background:#faf9ff;min-height:67px;width:100%;padding:10px;text-align:left;color:#2d2550;font-size:15px;font-weight:900;margin:10px 0}.option.on{border-color:#673fe5;background:#efebff}.key{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font:700 22px Fredoka,sans-serif;color:white;background:#ed4c80;flex:none}.option:nth-child(2) .key{background:#3a87e7}.option:nth-child(3) .key{background:#20b983}.option:nth-child(4) .key{background:#f0b426}.option.on .key{box-shadow:0 0 0 3px #372484}.helper{font-size:12px;color:#9289ad;font-weight:700;text-align:center}.resulttop{text-align:center;padding:28px 17px;color:white;background:linear-gradient(135deg,#5e35d6,#9e31d2,#d1429a)}.resulttop .cup{font-size:71px;animation:bob 2s infinite}.resulttop h1{font:700 34px Fredoka,sans-serif;margin:10px 0}.resulttop p{font-size:15px;font-weight:800;margin:0}.rank{display:flex;align-items:center;gap:10px;padding:11px;background:#f7f3ff;border:2px solid #e8ddf9;border-radius:15px;margin:10px 0}.rank.gold{background:#fffae4;border-color:#ffe083}.place{width:38px;text-align:center;font:600 20px Fredoka,sans-serif;color:#6d4cc4}.rank .face{font-size:29px}.rank .name{flex:1;font-weight:900;overflow-wrap:anywhere}.rank .score{background:white;padding:7px 10px;border-radius:10px;font:600 21px Fredoka,sans-serif}.rank .score small{font:900 10px Nunito,sans-serif;display:block;color:#8d82a5;text-align:center}.details{margin-top:26px}.details summary{background:#f2ecff;border-radius:12px;color:#643ab6;padding:14px;font-weight:900;cursor:pointer}.review{padding:13px 3px;border-bottom:1px solid #ede8f7;font-size:13px;line-height:1.5}.review b{display:block;margin-bottom:4px}.review strong{color:#15926a}.review .miss{color:#bd4269}.review p{color:#655b84;margin:5px 0 0}.buttons{display:grid;gap:12px;margin-top:22px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);border-radius:40px;color:white;background:#1d1547;padding:11px 17px;font-size:13px;font-weight:900;z-index:20;box-shadow:0 12px 30px #0005}.confetti{position:fixed;top:-50px;font-size:23px;animation:fall 3.5s linear forwards;z-index:40;pointer-events:none}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes fall{to{transform:translateY(105vh) rotate(600deg);opacity:0}}@media (min-width:600px){.shell{padding-top:25px}.body{padding:28px 35px}.banner{padding:29px 31px}}@media(prefers-reduced-motion:reduce){*,*:after,*:before{animation:none!important;transition:none!important}}

<script>
(()=>{"use strict";
const D=[["🛡️","Cyberbullying","#d4377c",[["Um vídeo de um aluno tropeçando numa apresentação foi compartilhado em um grupo. No início, os colegas disseram que era apenas humor; depois, passaram a produzir montagens e apelidos ofensivos. Mesmo após o pedido do aluno para parar, novas publicações continuaram circulando.\n\nQual análise interpreta MELHOR a situação?",["A intenção de quem fez a primeira gravação define se os compartilhamentos posteriores são aceitáveis, mesmo quando a vítima se sente humilhada.","A repercussão deve ser considerada ofensiva apenas se o vídeo ultrapassar o grupo original e atingir pessoas de fora da escola.","A repetição da exposição e das humilhações, apesar do pedido para parar, exige proteção da vítima e intervenção responsável.","O fato de colegas terem rido no começo torna necessária uma conversa, mas impede caracterizar os episódios seguintes como agressão."],2,"A alternativa C considera a repetição, o impacto e a continuidade dos ataques. Nem a intenção inicial nem a popularidade do vídeo anulam a humilhação."],["Uma estudante presencia ataques contra uma colega num grupo da turma. Ela quer ajudar, mas percebe que republicar as ofensas poderia aumentar a exposição. Também considera responder agressivamente aos autores para defender a vítima.\n\nQual ação concilia MELHOR solidariedade e prevenção de novos danos?",["Confrontar publicamente os autores em tom ofensivo para demonstrar que a vítima não está sozinha.","Guardar evidências sem redistribuí-las, acolher a colega e buscar o apoio de um adulto ou da escola.","Repostar as mensagens em outros grupos para mobilizar o maior número possível de colegas antes de pedir ajuda.","Esperar que a própria vítima faça uma denúncia, evitando qualquer aproximação para não interferir no conflito."],1,"B reúne proteção, acolhimento e encaminhamento. Revidar ou republicar pode ampliar o problema; a omissão não ajuda a vítima."],["Uma conta anônima publica insultos a estudantes durante o fim de semana. Na segunda-feira, as mensagens passam a circular entre colegas na sala e uma das vítimas começa a faltar às aulas. Alguns afirmam que a escola não deve agir porque as publicações ocorreram fora dela.\n\nQual é a conclusão MAIS adequada?",["A escola deve divulgar suspeitas sobre o autor para acelerar a identificação do perfil e evitar novos comentários.","A situação não deve ser tratada pela escola enquanto as mensagens forem publicadas fora do horário das aulas.","Cabe exclusivamente aos colegas decidir como reagir, pois a participação de adultos pode tornar o problema mais visível.","A escola pode acolher, orientar e adotar medidas educativas e de proteção diante dos impactos sobre a convivência."],3,"D reconhece os efeitos na vida escolar sem justificar exposição de suspeitos. A localização digital não torna o sofrimento irrelevante."],["Uma aluna publica uma foto para registrar uma atividade escolar. Alguém cria uma montagem ridicularizando sua aparência e afirma que ela não pode reclamar porque a imagem já estava na internet. Outros estudantes discutem se uma publicação representa autorização para qualquer uso posterior.\n\nQual princípio responde MELHOR a esse argumento?",["Compartilhar uma imagem não equivale a consentir com usos humilhantes; contexto, finalidade e possíveis danos devem ser considerados.","Postagens abertas podem ser modificadas livremente, desde que a montagem traga a identificação do perfil original.","Uma montagem deixa de ser ofensiva se seu autor declarar que pretendeu fazer uma brincadeira para o grupo.","Somente fotografias enviadas em conversas privadas podem provocar exposição inadequada ou exigir respeito."],0,"A distingue publicação e autorização para usos ofensivos. Humor e acesso público não eliminam respeito à dignidade e à privacidade."],["Uma estudante publica uma crítica fundamentada ao trabalho de uma equipe, apontando dados incompletos e sugerindo melhorias. Alguns colegas respondem aos argumentos; outros passam a atacá-la pessoalmente com apelidos e repetidas mensagens de humilhação. Um aluno defende que ambas as reações são apenas liberdade de expressão.\n\nQual critério é MAIS adequado para avaliá-las?",["Qualquer discordância expressa digitalmente é uma agressão, mesmo quando questiona somente as ideias do projeto.","A crítica é legítima apenas quando a maioria dos integrantes concorda com a opinião apresentada pela estudante.","Questionar ideias com argumentos difere de atacar repetidamente uma pessoa; a liberdade de expressão não justifica humilhação.","Quem inicia o debate público perde o direito de pedir respeito nas respostas, pois assumiu o risco de receber comentários."],2,"C separa crítica legítima de ataques pessoais reiterados. Discordar de argumentos não autoriza humilhar seus autores."]]],["✨","Padrões de beleza","#bd9016",[["Uma influenciadora divulga duas fotografias e atribui a diferença corporal a um produto anunciado por ela. Porém, ângulo, luz, posição e filtros não são os mesmos. Seguidores comentam que as imagens comprovam a eficácia do produto e mostram o corpo que todos deveriam buscar.\n\nQual leitura crítica é a MAIS fundamentada?",["Duas fotografias sequenciais são prova suficiente do resultado, ainda que as condições de produção visual sejam distintas.","Escolhas de edição e fotografia podem criar contrastes; as imagens isoladas não provam eficácia nem definem um padrão obrigatório.","Como se trata de publicidade, o produto não pode funcionar, independentemente de qualquer pesquisa que venha a ser feita.","Se a publicação apresentar muitas curtidas, a recepção positiva substitui a necessidade de analisar as condições das fotos."],1,"B distingue aparência visual de evidência sobre o produto. Edição e enquadramento podem influenciar a percepção; popularidade não comprova resultados."],["Depois de curtir vídeos de exercícios físicos, uma adolescente começa a receber conteúdos com corpos muito semelhantes. Ela conclui que aquele tipo de aparência deve ser considerado o mais bonito por todas as pessoas. Uma amiga lembra que plataformas personalizam recomendações a partir das interações.\n\nQual interpretação é MAIS coerente com essa informação?",["A repetição dos vídeos comprova que o padrão exibido é aceito pela maioria da população.","A personalização evita comparações, pois o usuário já demonstrou interesse prévio naquele tipo de conteúdo.","A frequência de determinado corpo no feed permite concluir que ele corresponde ao padrão de saúde mais adequado.","Um conteúdo repetido pode parecer universal sem representar a diversidade de corpos e preferências existentes."],3,"D relaciona a seleção algorítmica à impressão de consenso. O que aparece com frequência num feed não representa todas as pessoas."],["Uma turma compara uma selfie original e outra com retoques de pele e alterações no rosto. Alguns alunos dizem que qualquer filtro deve ser condenado. Outros sugerem identificar as mudanças e debater como elas podem afetar as comparações feitas por quem vê a publicação.\n\nQual abordagem desenvolve MELHOR o pensamento crítico?",["Analisar as alterações e discutir efeitos possíveis, reconhecendo que as consequências dependem do contexto e do uso.","Afirmar que toda alteração digital prejudica a autoestima, independentemente de intenção, frequência ou recepção.","Escolher a foto que recebeu mais curtidas como referência, porque a aprovação coletiva fornece um critério objetivo.","Evitar a análise das imagens e discutir somente tempo de tela, pois recursos visuais não influenciam a autoestima."],0,"A permite questionar representações e efeitos sem a generalização de que todos os filtros causam danos iguais."],["Uma turma prepara um cartaz sobre diversidade. Um grupo escolhe apenas celebridades muito populares; outro inclui uma única pessoa fora do padrão e a identifica como 'exceção'. Um terceiro grupo propõe mostrar diferentes corpos e estilos sem estabelecer uma ordem de beleza.\n\nQual proposta enfrenta de forma MAIS consistente a imposição de um padrão?",["Mostrar celebridades mais conhecidas, porque a popularidade nas redes estabelece referências coletivas confiáveis.","Incluir uma pessoa considerada diferente e explicar por que ela não corresponde ao ideal predominante.","Representar a diversidade sem hierarquizá-la e discutir por que certos tipos de aparência recebem mais destaque.","Exibir somente pessoas sem maquiagem, pois isso substitui padrões artificiais por um único padrão legítimo."],2,"C questiona a hierarquização dos corpos. Colocar alguém como exceção ou criar outro padrão obrigatório mantém a lógica da exclusão."],["Um vídeo patrocinado promete que qualquer adolescente alcançará o 'corpo perfeito' em poucas semanas. Ele reúne testemunhos e imagens atraentes, mas não apresenta pesquisas verificáveis nem considera diferenças individuais. Um grupo avalia se essa mensagem pode orientar escolhas pessoais.\n\nQual posicionamento é o MAIS responsável?",["Os depoimentos bastam para validar o método, pois experiências pessoais constituem uma prova aplicável a todos.","A ausência de fontes não importa quando a apresentação do vídeo é detalhada e o anunciante explica o processo.","Promessas estéticas são aceitáveis se forem descritas como busca de saúde, mesmo quando exigem aparência idêntica.","A promessa deve ser questionada por falta de evidência e por transformar um ideal estético em obrigação universal."],3,"D une avaliação de evidências e crítica ao padrão único. Depoimentos não demonstram que um método funcione para todos."]]],["💖","Celular e autoestima","#4664e5",[["Dois estudantes publicam projetos semelhantes. Um recebe muitas curtidas após ser compartilhado por um perfil popular; outro recebe poucas e conclui que é menos competente. Uma professora lembra que o alcance das publicações depende de vários fatores além da qualidade.\n\nQual interpretação diferencia MELHOR métricas digitais de autoestima?",["O número de interações pode refletir o alcance e o contexto, mas não determina o valor ou a capacidade pessoal.","A comparação é objetiva sempre que os trabalhos são publicados no mesmo dia, pois isso elimina diferenças de visibilidade.","Um trabalho com poucas curtidas deve ser considerado inferior se não recebeu ajuda de perfis populares.","Reações digitais não influenciam emoções, portanto a frustração sentida pelo estudante não merece atenção."],0,"A separa repercussão digital de valor pessoal. Sentimentos podem ser reais sem que os números comprovem talento ou dignidade."],["Após acompanhar publicações de viagens e festas, uma estudante diz que é a única pessoa com uma vida comum. Ela não percebe que amigos geralmente registram ocasiões escolhidas e deixam de mostrar boa parte da rotina e dos problemas.\n\nQual dificuldade de interpretação aparece nessa comparação?",["A estudante observou uma amostra completa da vida dos colegas, mas atribuiu importância excessiva às atividades de lazer.","Ela generalizou a partir de momentos selecionados, tratando publicações como retrato integral da vida das outras pessoas.","A conclusão é confiável porque diferentes perfis publicaram conteúdos semelhantes no mesmo período.","O problema principal é que qualquer postagem alegre é necessariamente prejudicial à saúde emocional de quem a vê."],1,"B identifica o viés da seleção: posts destacados não representam o cotidiano completo."],["Num debate, um aluno diz que se comparar nas redes é sempre ruim. Um colega relata que observar artistas o inspirou a desenhar melhor; outra estudante conta que comparar sua aparência a fotos editadas gera insegurança.\n\nQual conclusão considera MELHOR as duas experiências?",["Os relatos são incompatíveis e, por isso, não é possível tirar nenhuma conclusão sobre comparação social.","Quando um conteúdo ensina alguma habilidade, sua influência sobre a autoestima será sempre positiva.","Os efeitos variam com o conteúdo, o objetivo e a experiência: referências podem motivar ou provocar sofrimento.","O caso de insegurança demonstra que plataformas digitais não podem contribuir para aprendizagens significativas."],2,"C reconhece que a comparação pode ter efeitos distintos sem tratar a internet como inteiramente benéfica ou nociva."],["Uma adolescente vê que a amiga leu sua mensagem mas não respondeu logo. Ela entende o silêncio como rejeição e publica uma indireta. Horas depois descobre que a amiga estava ocupada. A insegurança surgiu de uma interpretação precipitada de um sinal digital.\n\nQual postura seria MAIS adequada diante de situações semelhantes?",["Tomar o aviso de leitura como prova de desinteresse, pois ele revela o que a outra pessoa sente.","Exigir respostas imediatas de amigos para evitar que sinais ambíguos gerem mal-entendidos.","Publicar indiretas cuidadosas, porque isso expressa emoções sem criar necessidade de conversar.","Evitar inferir intenções de um indicador isolado e, quando necessário, dialogar diretamente sobre expectativas."],3,"D evita suposições sobre sentimentos alheios. A confirmação de leitura não explica motivos nem disponibilidade."],["Um aluno percebe ansiedade ao revisar o número de curtidas de suas fotos. Ele gosta de usar redes para conversar com amigos, mas passa a apagar publicações quando não recebe as reações desejadas.\n\nQual estratégia reduz MAIS diretamente a dependência de aprovação sem eliminar usos positivos?",["Ativar alertas para acompanhar a evolução das curtidas com maior precisão e frequência.","Diminuir a checagem de métricas, valorizar outras formas de reconhecimento e preservar interações que fazem bem.","Abandonar permanentemente qualquer comunicação digital, pois todas as redes provocam efeitos idênticos.","Publicar nos horários de maior audiência, transformando a aprovação recebida numa meta pessoal mais estável."],1,"B trata o hábito que alimenta a ansiedade, sem impor proibição total. Otimizar curtidas mantém o foco na aprovação externa."]]],["🌱","Uso saudável do celular","#159f79",[["Dois adolescentes relatam duas horas diárias de tela. Um usa esse tempo para estudar, falar com familiares e depois faz outras atividades; o outro assiste a vídeos na cama, dorme tarde e deixa tarefas pendentes. Um colega conclui que os efeitos precisam ser iguais porque o tempo foi o mesmo.\n\nQual avaliação é MAIS consistente?",["A duração das atividades determina o impacto por si só, independentemente de contexto ou finalidade.","O uso para estudos compensa automaticamente prejuízos relacionados ao sono em qualquer outro momento do dia.","Além da duração, é importante considerar conteúdo, horário, finalidade e consequências para sono e rotina.","Qualquer atividade de lazer por telas é prejudicial, enquanto usos escolares são sempre benéficos."],2,"C considera contexto e consequências. O tempo é relevante, mas não descreve sozinho o bem-estar."],["Um estudante está sempre interrompendo a leitura por causa das notificações. Entretanto, precisa continuar acessível caso um familiar tenha uma emergência. Amigos sugerem desligar o celular ou responder a todas as mensagens imediatamente.\n\nQual escolha oferece o MELHOR equilíbrio entre foco e comunicação necessária?",["Configurar modo de foco com exceções para contatos essenciais e consultar mensagens comuns nos intervalos.","Manter todos os alertas ligados, pois qualquer mensagem recebida pode ser mais importante que a tarefa atual.","Desligar o aparelho durante o dia inteiro, mesmo quando precisa receber informações urgentes de familiares.","Trocar de aplicativo sempre que chegar uma notificação para não deixar conversas sem resposta."],0,"A reduz distrações e preserva contatos prioritários. Nem todas as notificações precisam interromper a atividade."],["Uma aluna costuma assistir a vídeos por 'só mais cinco minutos' antes de dormir, mas acaba ficando conectada por mais de uma hora. No dia seguinte sente sono e dificuldade de concentração. Ela deseja manter o celular para outras atividades, mas mudar esse hábito.\n\nQual plano enfrenta MELHOR o problema descrito?",["Substituir vídeos longos por vídeos curtos, mantendo o uso sem estabelecer horário de encerramento.","Trocar vídeos por mensagens na cama, supondo que todo tipo de interação digital favoreça o descanso.","Eliminar qualquer uso do celular, inclusive estudo e comunicação familiar, para garantir disciplina.","Definir horário para parar de usar telas à noite e criar uma rotina mais tranquila antes de dormir."],3,"D atua no atraso da hora de dormir de forma proporcional. Trocar só o aplicativo não garante descanso."],["Um vídeo viral afirma que certa técnica melhora a atenção de 'todos os estudantes', mas não apresenta fontes, dados verificáveis nem estudos. Alguns alunos querem compartilhá-lo na escola porque a edição parece profissional e recebeu muitas curtidas.\n\nQual atitude demonstra uso MAIS responsável da informação digital?",["Confiar no número de curtidas, pois a popularidade torna improvável a circulação de informações erradas.","Verificar quem produziu a afirmação, consultar fontes confiáveis e buscar confirmação antes de compartilhá-la como fato.","Rejeitar automaticamente qualquer conteúdo em vídeo, mesmo quando apresenta fontes e resultados verificáveis.","Repassar com a frase 'não sei se é verdade', já que declarar dúvida substitui a necessidade de checagem."],1,"B prioriza evidências e fontes independentes. Aparência profissional e popularidade não comprovam afirmações."],["Uma turma planeja uma Semana de Uso Consciente. Alguns propõem proibir totalmente os celulares; outros sugerem pausas, atenção ao sono e momentos de convivência, lembrando que os estudantes também usam a tecnologia para estudar e falar com familiares.\n\nQual proposta desenvolve MELHOR a autonomia digital?",["Aplicar a mesma proibição a todos, independentemente de necessidades pessoais, para produzir resultados comparáveis.","Medir o sucesso apenas pela menor quantidade de minutos, sem investigar quais atividades ocorreram nas telas.","Estabelecer limites ajustados à rotina, observar seus efeitos e reformular hábitos quando necessário.","Trocar aplicativos usados, mantendo os mesmos horários e avaliando o progresso apenas pelo número de acessos."],2,"C associa limites a objetivos e observação dos efeitos. Autonomia exige escolhas conscientes, não só reduzir minutos."]]]];
const AN=["🦊","🐼","🐱","🐯","🦄","🐧","🐸","🦁","🐻","🐙","🦋","🐰"];
const KEY="telas_quiz_tablet_v4_enem",root=document.getElementById("root");let s=null,icons=[0,1,2,3,4],tickId=null;
const clean=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mix=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function stop(){if(tickId){clearInterval(tickId);tickId=null}}
function wrapper(main){root.innerHTML='<div class="mast"><div class="brand"><span>📱</span> POR TRÁS DAS TELAS <span style="font-size:10px;background:#22b36f;padding:4px 7px;border-radius:100px">DESAFIO ENEM ✓</span></div><button class="share" data-action="share">↗ Compartilhar</button></div><section class="card">'+main+'</section><div class="outside">✨ Dinâmica educativa • 5 participantes • Um tablet</div>'}
function setup(){
let f='';for(let i=0;i<5;i++)f+='<div class="line"><button class="avatarBtn" data-action="icon" data-i="'+i+'" aria-label="Trocar avatar">'+AN[icons[i]]+'</button><div><label for="j'+i+'">Jogador '+(i+1)+'</label><input id="j'+i+'" placeholder="Digite o nome" maxlength="20" autocomplete="off"></div></div>';
wrapper('<div class="banner"><span class="ribbon">🎮 QUIZ INTERATIVO</span><h1>POR TRÁS<br><em>DAS TELAS!</em></h1><p>1 tablet, 5 jogadores e 20 perguntas. Quem será o campeão?</p><div class="avatars"><span class="person">👧</span><span class="person">🧑</span><span class="person">👦🏽</span><span class="person">👩🏾</span><span class="mascot">📱</span></div></div><div class="body"><h2>✨ Cadastrem os jogadores</h2><p class="desc">Cada pessoa responde <b>4 perguntas</b>, uma de cada tema. Questões contextualizadas e alternativas embaralhadas. Leia com atenção! Toque no bichinho para trocar o avatar.</p><div class="chips"><span>👥 5 jogadores</span><span>🎯 20 perguntas</span><span>🏆 1 ponto por acerto</span></div>'+f+'<div class="checkrow"><div><b>⏱️ Cronômetro de 90 segundos</b><small>Opcional — deixe desligado para pensar com calma.</small></div><input type="checkbox" id="timerOn"></div><div id="error" class="error"></div><button data-action="start" class="btn">COMEÇAR PARTIDA →</button><div class="topicgrid"><div class="topic"><i>🛡️</i>Cyberbullying</div><div class="topic"><i>✨</i>Padrões de beleza</div><div class="topic"><i>💖</i>Celular e autoestima</div><div class="topic"><i>🌱</i>Uso saudável do celular</div></div><p class="note">🔒 Os nomes e resultados ficam salvos apenas neste aparelho.</p></div>')
}
function start(){
let names=Array.from(root.querySelectorAll(".line input")).map(e=>e.value.trim().replace(/\s+/g," "));
if(names.some(n=>!n)){root.querySelector("#error").textContent="Preencha os cinco nomes.";return}
if(new Set(names.map(n=>n.toLowerCase())).size!==5){root.querySelector("#error").textContent="Use nomes diferentes.";return}
newGame(names.map((n,i)=>({name:n,avatar:AN[icons[i]],score:0})),root.querySelector("#timerOn").checked)
}
function newGame(players,timer){
const bank=D.map(()=>mix([0,1,2,3,4])),offset=mix([0,1,2,3]),playersInSeats=mix([0,1,2,3,4]);let turns=[];
for(let r=0;r<4;r++)for(let seat of mix([0,1,2,3,4])){let t=offset[(seat+r)%4];turns.push({player:playersInSeats[seat],topic:t,index:bank[t].pop(),round:r+1,order:mix([0,1,2,3])})}
s={version:4,phase:"pass",players,turns,position:0,picked:null,results:[],timer,deadline:null};persist();render();window.scrollTo(0,0)
}
function pass(){
const turn=s.turns[s.position],p=s.players[turn.player],t=D[turn.topic];
wrapper('<div class="banner"><span class="ribbon">RODADA '+turn.round+' / 4</span><h1>É HORA DE<br><em>PASSAR O TABLET!</em></h1><p>PERGUNTA '+(s.position+1)+' DE 20</p></div><div class="handoff"><div class="huge">'+clean(p.avatar)+'</div><h2>Agora é a vez de<br><strong>'+clean(p.name)+'!</strong></h2><p>Entregue o tablet para <b>'+clean(p.name)+'</b>.<br>Quando estiver pronto(a), toque para abrir a próxima pergunta.</p><div class="sub">'+t[0]+' Tema da vez: '+clean(t[1])+'</div><button class="btn" data-action="ready">ESTOU PRONTO(A) →</button><p class="note">Não revelaremos as respostas corretas até o final do jogo.</p></div>')
}
function question(){
const turn=s.turns[s.position],t=D[turn.topic],p=s.players[turn.player],q=t[3][turn.index],order=turn.order||[0,1,2,3];
let opts="";
order.forEach((original,i)=>{opts+='<button class="option'+(s.picked===i?' on':'')+'" data-action="pick" data-i="'+i+'" aria-pressed="'+(s.picked===i)+'"><span class="key">'+("ABCD"[i])+'</span>'+clean(q[1][original])+'</button>'});
wrapper('<div class="qbanner" style="--color:'+t[2]+'"><div class="qtop"><span>'+clean(p.avatar)+' '+clean(p.name)+'</span><span class="timer" id="counter">'+(s.timer?'⏱ 90s':'Sem tempo limite')+'</span></div><div class="qtop"><span>QUESTÃO '+(s.position+1)+' DE 20</span><span>RODADA '+turn.round+' DE 4</span></div><div class="meter"><div style="width:'+(s.position/20*100)+'%"></div></div><span class="tag">'+t[0]+' '+clean(t[1])+' • DESAFIO ENEM</span><h2 class="enemText">'+clean(q[0])+'</h2></div><div class="body"><h2 class="chooseTitle">Leia e escolha a alternativa mais adequada</h2><div class="options">'+opts+'</div><button class="btn" data-action="next" id="next" '+(s.picked===null?'disabled':'')+'>CONFIRMAR RESPOSTA ✓</button><p class="helper">🧠 Compare as alternativas: apenas uma interpreta melhor o caso apresentado.</p></div>');
if(s.timer)clock();
}
function clock(){stop();if(!s.deadline){s.deadline=Date.now()+90000;persist()}function t(){if(s.phase!=="question"){stop();return}let rem=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));let e=root.querySelector("#counter");if(e){e.textContent="⏱ "+rem+"s";e.classList.toggle("low",rem<=10)}if(rem===0)next(true)}t();tickId=setInterval(t,350)}
function next(timeout){
if(s.phase!=="question"||(!timeout&&s.picked===null))return;
stop();
const turn=s.turns[s.position],q=D[turn.topic][3][turn.index],order=turn.order||[0,1,2,3],correct=s.picked!==null&&order[s.picked]===q[2];
s.results.push({player:turn.player,topic:turn.topic,index:turn.index,selected:s.picked,correct,order});
if(correct)s.players[turn.player].score++;
s.feedback={player:turn.player,topic:turn.topic,index:turn.index,selected:s.picked,correct,order};
s.deadline=null;s.phase="feedback";persist();render();window.scrollTo(0,0);
}
function feedback(){
const a=s.feedback,t=D[a.topic],q=t[3][a.index],p=s.players[a.player],order=a.order||[0,1,2,3],right=order.indexOf(q[2]);
const opts=order.map((orig,i)=>'<div class="option '+(i===right?'correctChoice':(i===a.selected?'wrongChoice':''))+'" role="listitem"><span class="key">'+("ABCD"[i])+'</span><span>'+clean(q[1][orig])+'</span>'+(i===right?'<b class="choiceMark">✓</b>':i===a.selected?'<b class="choiceMark">✕</b>':'')+'</div>').join("");
wrapper('<div class="feedbackBanner '+(a.correct?'yay':'oops')+'"><div class="feedbackIcon">'+(a.correct?'✅':'❌')+'</div><h1>'+(a.correct?'ACERTOU!':'ERROU!')+'</h1><p>'+(a.correct?'Excelente interpretação! Você ganhou 1 ponto.':'Compare as alternativas e descubra qual responde melhor ao enunciado.')+'</p></div><div class="body"><div class="qtop"><span>'+clean(p.avatar)+' '+clean(p.name)+'</span><span>'+t[0]+' '+clean(t[1])+'</span></div><h2 class="enemFeedbackText">'+clean(q[0])+'</h2><div class="feedbackChoices" role="list">'+opts+'</div><div class="feedbackExplain"><strong>💡 Entenda a resposta</strong><p><b>Alternativa '+("ABCD"[right])+'.</b> '+clean(q[3])+'</p></div><button class="btn" data-action="advance">'+(s.position===19?'🏆 VER RESULTADO FINAL':'PRÓXIMA PERGUNTA →')+'</button><p class="helper">Passe o tablet somente quando aparecer o próximo jogador.</p></div>');
}
function advance(){
if(s.phase!=="feedback")return;
s.position++;s.picked=null;s.deadline=null;s.feedback=null;
s.phase=s.position===20?"result":"pass";
persist();render();window.scrollTo(0,0);
if(s.phase==="result")confetti();
}
function results(){
const ranks=s.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score),best=ranks[0].score,winners=ranks.filter(p=>p.score===best);
let h='<div class="resulttop"><div class="cup">🏆</div><h1>'+(winners.length>1?'TEMOS UM EMPATE!':'TEMOS UM CAMPEÃO!')+'</h1><p>'+(winners.length>1?winners.map(p=>clean(p.name)).join(" e ")+" acertaram "+best+" de 4!":clean(winners[0].name)+" venceu com "+best+" de 4 acertos!")+'</p></div><div class="body"><h2>Ranking final</h2><p class="desc">Cada jogador recebeu uma pergunta de cada tema. Veja os resultados!</p>';
let last=-1,rank=0;
ranks.forEach((p,i)=>{if(p.score!==last){rank=i+1;last=p.score}h+='<div class="rank'+(p.score===best?' gold':'')+'"><span class="place">'+(rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank+'º')+'</span><span class="face">'+clean(p.avatar)+'</span><span class="name">'+clean(p.name)+'</span><span class="score">'+p.score+'/4<small>ACERTOS</small></span></div>'});
h+='<details class="details"><summary>📚 Ver gabarito comentado (20 perguntas)</summary>';
D.forEach((topic,ti)=>{h+='<h3 style="color:'+topic[2]+';margin:18px 0 0">'+topic[0]+' '+clean(topic[1])+'</h3>';s.results.filter(a=>a.topic===ti).forEach(a=>{const q=topic[3][a.index],p=s.players[a.player];h+='<div class="review"><b>'+clean(p.avatar)+' '+clean(p.name)+' — '+clean(q[0])+'</b><strong class="'+(a.correct?'':'miss')+'">'+(a.correct?'✓ Acertou':'✗ Errou')+' • Correta: '+("ABCD"[(a.order||[0,1,2,3]).indexOf(q[2])])+') '+clean(q[1][q[2]])+'</strong><p>'+clean(q[3])+'</p></div>'})});
h+='</details><div class="buttons"><button class="btn" data-action="again">🔀 JOGAR DE NOVO</button><button class="btn light" data-action="reset">👥 TROCAR JOGADORES</button><button class="btn secondary" data-action="share">↗ COMPARTILHAR O LINK</button></div><p class="note">Cada nova partida embaralha perguntas e turnos. Os dados ficam salvos somente neste tablet.</p></div>';wrapper(h)
}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;for(let i=0;i<24;i++){const e=document.createElement("span");e.className="confetti";e.textContent=["✨","⭐","💛","🎉","💜"][i%5];e.style.left=Math.random()*100+"vw";e.style.animationDelay=Math.random()*1.3+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}
function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
async function share(){const url=location.origin+location.pathname;try{if(navigator.share)await navigator.share({title:"Quiz Por Trás das Telas",text:"Jogue o quiz sobre redes sociais e autoestima!",url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);toast("Link copiado! 📋")}else toast("Copie o endereço na barra do navegador.")}catch(e){}}
function render(){stop();if(!s){setup();return}if(s.phase==="pass")pass();else if(s.phase==="question")question();else if(s.phase==="feedback")feedback();else if(s.phase==="result")results()}
root.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;if(a==="icon"){let i=+b.dataset.i;icons[i]=(icons[i]+1)%AN.length;b.textContent=AN[icons[i]]}else if(a==="start")start();else if(a==="ready"){s.phase="question";s.deadline=null;s.picked=null;persist();render()}else if(a==="pick"&&s.phase==="question"){s.picked=+b.dataset.i;persist();render()}else if(a==="next")next(false);else if(a==="advance")advance();else if(a==="again"){newGame(s.players.map(p=>({...p,score:0})),s.timer)}else if(a==="reset"){stop();s=null;localStorage.removeItem(KEY);setup()}else if(a==="share")share()});
try{let old=JSON.parse(localStorage.getItem(KEY)||"null");if(old&&old.version===4&&old.players?.length===5&&old.turns?.length===20&&old.position>=0&&old.position<=20&&["pass","question","feedback","result"].includes(old.phase))s=old}catch(e){}render();
})();
</script></body></html>
