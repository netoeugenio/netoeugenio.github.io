<script>
(()=>{"use strict";
const D=[
["🛡️","Cyberbullying","#d4377c",[
["Qual situação é um exemplo de cyberbullying?",["Dar parabéns pelo aniversário","Humilhar alguém repetidamente num grupo de mensagens","Mandar um trabalho da escola","Conversar sobre um filme"],1,"Humilhação ou intimidação por meios digitais pode ser cyberbullying."],
["Alguém compartilha uma montagem para ridicularizar um colega. O melhor é:",["Repostar para todo mundo","Responder com xingamentos","Não espalhar, apoiar a vítima e avisar um adulto","Curtir a publicação"],2,"Não compartilhe a agressão. Apoie a pessoa e procure ajuda de um adulto ou da escola."],
["Por que ofensas pela internet podem machucar?",["Porque podem circular e afetar as emoções reais da pessoa","Porque não atingem ninguém de verdade","Porque sempre desaparecem imediatamente","Porque todo mundo acha engraçado"],0,"O sofrimento de quem recebe ofensas é real, mesmo quando ocorre on-line."],
["Uma pessoa recebe mensagens agressivas repetidas. O que pode ajudá-la?",["Revidar humilhando a outra pessoa","Guardar evidências, denunciar e procurar apoio","Criar um perfil falso para se vingar","Divulgar os ataques para mais gente"],1,"Guardar provas, bloquear ou denunciar e conversar com adultos de confiança pode ajudar."],
["Curtir um comentário que humilha alguém pode:",["Ajudar a pessoa humilhada","Não ter nenhum efeito","Reforçar a agressão","Apagar a postagem"],2,"Reações e compartilhamentos podem incentivar quem agride e aumentar a exposição."]]],
["✨","Padrões de beleza","#c69c1a",[
["Por que algumas fotos nas redes parecem perfeitas?",["Porque mostram todos os momentos da vida","Porque podem ter filtros, edição e iluminação planejada","Porque ninguém usa edição","Porque existe um único tipo de beleza"],1,"Muitas imagens são cuidadosamente selecionadas ou alteradas antes de serem postadas."],
["Ver sempre um único tipo de corpo como 'ideal' pode:",["Ensinar que todos são iguais","Aumentar comparações e inseguranças","Melhorar automaticamente a saúde","Fazer as diferenças desaparecerem"],1,"A repetição de padrões irreais pode influenciar a forma como nos vemos."],
["Qual afirmação sobre beleza faz mais sentido?",["Todas as pessoas precisam parecer iguais","Só influenciadores definem beleza","A beleza é diversa; não existe um único padrão","A beleza depende de seguidores"],2,"Os padrões mudam com o tempo e a cultura. Não existe uma definição única."],
["Uma pessoa se compara com fotos muito editadas. O que seria mais saudável?",["Criticar a própria aparência ainda mais","Imitar tudo que vê","Lembrar das edições e valorizar suas características","Deixar de conviver com amigos"],2,"Fotos editadas não são medidas justas de valor ou aparência."],
["Acompanhar criadores com diferentes estilos e corpos pode ajudar a:",["Respeitar a diversidade","Criar uma regra de beleza","Excluir quem é diferente","Fazer todas as pessoas se vestirem igual"],0,"Ver diversidade amplia referências e ajuda a questionar padrões estreitos."]]],
["💖","Celular e autoestima","#4664e5",[
["O que é autoestima?",["O número de seguidores","Como a pessoa se percebe e se valoriza","O modelo do telefone","O total de curtidas"],1,"Autoestima é como percebemos e valorizamos a nós mesmos."],
["Se uma foto recebe poucas curtidas, isso significa que:",["A pessoa vale menos","A foto deve ser apagada","Curtidas não definem o valor de ninguém","A pessoa não tem amigos"],2,"Curtidas são reações numa plataforma, não uma medida de valor pessoal."],
["Por que parece que todos vivem melhor nas redes?",["Porque ninguém tem problemas","Porque vemos momentos selecionados da vida dos outros","Porque todas as postagens mostram a rotina inteira","Porque ninguém edita o que publica"],1,"Em geral, vemos recortes e destaques, não a vida completa das pessoas."],
["Se um perfil te deixa mal com frequência, você pode:",["Continuar seguindo por obrigação","Comparar-se ainda mais","Silenciar ou deixar de seguir e buscar apoio se preciso","Copiar todas as fotos"],2,"Você pode controlar parte do que acompanha e conversar com alguém de confiança."],
["Qual é um sinal de que o celular está afetando seu bem-estar?",["Usá-lo para aprender","Falar com amigos e depois descansar","Perder sono e se sentir mal após se comparar constantemente","Tirar uma foto em um passeio"],2,"Conteúdos e hábitos podem prejudicar quando interferem no humor, sono ou rotina."]]],
["🌱","Uso saudável do celular","#159f79",[
["Usar o celular de forma saudável é:",["Ficar na internet a madrugada toda","Equilibrar tela, estudos, sono e convivência","Responder toda mensagem imediatamente","Abandonar atividades presenciais"],1,"Equilíbrio significa reservar tempo também para descansar, estudar e conviver."],
["Qual hábito pode ajudar a dormir melhor?",["Aumentar o brilho do celular","Passar a noite rolando vídeos","Reduzir o uso do celular antes de dormir","Deixar notificações ligadas toda a noite"],2,"Menos estímulo de telas à noite pode contribuir para uma boa rotina de sono."],
["Silenciar notificações durante uma atividade pode:",["Reduzir distrações e ajudar na concentração","Apagar todas as mensagens","Acabar com suas amizades","Desligar permanentemente o aparelho"],0,"Você pode escolher horários de foco e manter exceções importantes."],
["Você percebe que passa horas rolando vídeos. Qual atitude pode ajudar?",["Abrir mais aplicativos","Ignorar as tarefas","Definir pausas e limites de uso","Usar o celular até adormecer"],2,"Definir horários e criar pausas ajuda a usar as telas com intenção."],
["O celular é uma ferramenta positiva quando:",["Substitui todos os amigos","Ajuda a aprender, criar e conversar com equilíbrio","Sempre atrapalha o sono","É a única diversão permitida"],1,"A tecnologia pode aproximar, informar e divertir, dependendo de como é usada."]]]
];
const AN=["🦊","🐼","🐱","🐯","🦄","🐧","🐸","🦁","🐻","🐙","🦋","🐰"];
const KEY="telas_quiz_tablet_v2",root=document.getElementById("root");let s=null,icons=[0,1,2,3,4],tickId=null;
const clean=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mix=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function stop(){if(tickId){clearInterval(tickId);tickId=null}}
function wrapper(main){root.innerHTML='<div class="mast"><div class="brand"><span>📱</span> POR TRÁS DAS TELAS</div><button class="share" data-action="share">↗ Compartilhar</button></div><section class="card">'+main+'</section><div class="outside">✨ Dinâmica educativa • 5 participantes • Um tablet</div>'}
function setup(){
let f='';for(let i=0;i<5;i++)f+='<div class="line"><button class="avatarBtn" data-action="icon" data-i="'+i+'" aria-label="Trocar avatar">'+AN[icons[i]]+'</button><div><label for="j'+i+'">Jogador '+(i+1)+'</label><input id="j'+i+'" placeholder="Digite o nome" maxlength="20" autocomplete="off"></div></div>';
wrapper('<div class="banner"><span class="ribbon">🎮 QUIZ INTERATIVO</span><h1>POR TRÁS<br><em>DAS TELAS!</em></h1><p>1 tablet, 5 jogadores e 20 perguntas. Quem será o campeão?</p><div class="avatars"><span class="person">👧</span><span class="person">🧑</span><span class="person">👦🏽</span><span class="person">👩🏾</span><span class="mascot">📱</span></div></div><div class="body"><h2>✨ Cadastrem os jogadores</h2><p class="desc">Cada pessoa responde <b>4 perguntas</b>, uma de cada tema. A ordem dos jogadores e das questões será embaralhada. Toque no bichinho para trocar o avatar.</p><div class="chips"><span>👥 5 jogadores</span><span>🎯 20 perguntas</span><span>🏆 1 ponto por acerto</span></div>'+f+'<div class="checkrow"><div><b>⏱️ Cronômetro de 30 segundos</b><small>Opcional — deixe desligado para pensar com calma.</small></div><input type="checkbox" id="timerOn"></div><div id="error" class="error"></div><button data-action="start" class="btn">COMEÇAR PARTIDA →</button><div class="topicgrid"><div class="topic"><i>🛡️</i>Cyberbullying</div><div class="topic"><i>✨</i>Padrões de beleza</div><div class="topic"><i>💖</i>Celular e autoestima</div><div class="topic"><i>🌱</i>Uso saudável do celular</div></div><p class="note">🔒 Os nomes e resultados ficam salvos apenas neste aparelho.</p></div>')
}
function start(){
let names=Array.from(root.querySelectorAll(".line input")).map(e=>e.value.trim().replace(/\s+/g," "));
if(names.some(n=>!n)){root.querySelector("#error").textContent="Preencha os cinco nomes.";return}
if(new Set(names.map(n=>n.toLowerCase())).size!==5){root.querySelector("#error").textContent="Use nomes diferentes.";return}
newGame(names.map((n,i)=>({name:n,avatar:AN[icons[i]],score:0})),root.querySelector("#timerOn").checked)
}
function newGame(players,timer){
const bank=D.map(()=>mix([0,1,2,3,4])),offset=mix([0,1,2,3]),playersInSeats=mix([0,1,2,3,4]);let turns=[];
for(let r=0;r<4;r++)for(let seat of mix([0,1,2,3,4])){let t=offset[(seat+r)%4];turns.push({player:playersInSeats[seat],topic:t,index:bank[t].pop(),round:r+1})}
s={version:2,phase:"pass",players,turns,position:0,picked:null,results:[],timer,deadline:null};persist();render();window.scrollTo(0,0)
}
function pass(){
const turn=s.turns[s.position],p=s.players[turn.player],t=D[turn.topic];
wrapper('<div class="banner"><span class="ribbon">RODADA '+turn.round+' / 4</span><h1>É HORA DE<br><em>PASSAR O TABLET!</em></h1><p>PERGUNTA '+(s.position+1)+' DE 20</p></div><div class="handoff"><div class="huge">'+clean(p.avatar)+'</div><h2>Agora é a vez de<br><strong>'+clean(p.name)+'!</strong></h2><p>Entregue o tablet para <b>'+clean(p.name)+'</b>.<br>Quando estiver pronto(a), toque para abrir a próxima pergunta.</p><div class="sub">'+t[0]+' Tema da vez: '+clean(t[1])+'</div><button class="btn" data-action="ready">ESTOU PRONTO(A) →</button><p class="note">Não revelaremos as respostas corretas até o final do jogo.</p></div>')
}
function question(){
const turn=s.turns[s.position],t=D[turn.topic],p=s.players[turn.player],q=t[3][turn.index];let opts="";
q[1].forEach((o,i)=>{opts+='<button class="option'+(s.picked===i?' on':'')+'" data-action="pick" data-i="'+i+'" aria-pressed="'+(s.picked===i)+'"><span class="key">'+("ABCD"[i])+'</span>'+clean(o)+'</button>'});
wrapper('<div class="qbanner" style="--color:'+t[2]+'"><div class="qtop"><span>'+clean(p.avatar)+' '+clean(p.name)+'</span><span class="timer" id="counter">'+(s.timer?'⏱ 30s':'Sem tempo limite')+'</span></div><div class="qtop"><span>QUESTÃO '+(s.position+1)+' DE 20</span><span>RODADA '+turn.round+' DE 4</span></div><div class="meter"><div style="width:'+(s.position/20*100)+'%"></div></div><span class="tag">'+t[0]+' '+clean(t[1])+'</span><h2>'+clean(q[0])+'</h2></div><div class="body"><h2>Escolha sua resposta</h2>'+opts+'<button class="btn" data-action="next" id="next" '+(s.picked===null?'disabled':'')+'>CONFIRMAR RESPOSTA ✓</button><p class="helper">💡 Depois de responder, descubra na hora se acertou e leia a explicação.</p></div>');
if(s.timer)clock()
}
function clock(){stop();if(!s.deadline){s.deadline=Date.now()+30000;persist()}function t(){if(s.phase!=="question"){stop();return}let rem=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));let e=root.querySelector("#counter");if(e){e.textContent="⏱ "+rem+"s";e.classList.toggle("low",rem<=10)}if(rem===0)next(true)}t();tickId=setInterval(t,350)}
function next(timeout){
if(s.phase!=="question"||(!timeout&&s.picked===null))return;
stop();
const turn=s.turns[s.position],q=D[turn.topic][3][turn.index],correct=s.picked===q[2];
s.results.push({player:turn.player,topic:turn.topic,index:turn.index,selected:s.picked,correct});
if(correct)s.players[turn.player].score++;
s.feedback={player:turn.player,topic:turn.topic,index:turn.index,selected:s.picked,correct};
s.deadline=null;s.phase="feedback";persist();render();window.scrollTo(0,0);
}
function feedback(){
const a=s.feedback,t=D[a.topic],q=t[3][a.index],p=s.players[a.player];
const opts=q[1].map((label,i)=>'<div class="option '+(i===q[2]?'correctChoice':(i===a.selected?'wrongChoice':''))+'" role="listitem"><span class="key">'+("ABCD"[i])+'</span><span>'+clean(label)+'</span>'+(i===q[2]?'<b class="choiceMark">✓</b>':i===a.selected?'<b class="choiceMark">✕</b>':'')+'</div>').join("");
wrapper('<div class="feedbackBanner '+(a.correct?'yay':'oops')+'"><div class="feedbackIcon">'+(a.correct?'✅':'❌')+'</div><h1>'+(a.correct?'ACERTOU!':'ERROU!')+'</h1><p>'+(a.correct?'Muito bem! Você ganhou 1 ponto.':'Não foi dessa vez! Confira a resposta e entenda por quê.')+'</p></div><div class="body"><div class="qtop"><span>'+clean(p.avatar)+' '+clean(p.name)+'</span><span>'+t[0]+' '+clean(t[1])+'</span></div><h2>'+clean(q[0])+'</h2><div class="feedbackChoices" role="list">'+opts+'</div><div class="feedbackExplain"><strong>💡 Explicação</strong><p>'+clean(q[3])+'</p></div><button class="btn" data-action="advance">'+(s.position===19?'🏆 VER RESULTADO FINAL':'PRÓXIMA PERGUNTA →')+'</button><p class="helper">Passe o tablet somente quando chegar a tela do próximo jogador.</p></div>');
}
function advance(){
if(s.phase!=="feedback")return;
s.position++;s.picked=null;s.deadline=null;s.feedback=null;
s.phase=s.position===20?"result":"pass";
persist();render();window.scrollTo(0,0);
if(s.phase==="result")confetti();
}
function results(){
const ranks=s.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score),best=ranks[0].score,winners=ranks.filter(p=>p.score===best);
let h='<div class="resulttop"><div class="cup">🏆</div><h1>'+(winners.length>1?'TEMOS UM EMPATE!':'TEMOS UM CAMPEÃO!')+'</h1><p>'+(winners.length>1?winners.map(p=>clean(p.name)).join(" e ")+" acertaram "+best+" de 4!":clean(winners[0].name)+" venceu com "+best+" de 4 acertos!")+'</p></div><div class="body"><h2>Ranking final</h2><p class="desc">Cada jogador recebeu uma pergunta de cada tema. Veja os resultados!</p>';
let last=-1,rank=0;
ranks.forEach((p,i)=>{if(p.score!==last){rank=i+1;last=p.score}h+='<div class="rank'+(p.score===best?' gold':'')+'"><span class="place">'+(rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank+'º')+'</span><span class="face">'+clean(p.avatar)+'</span><span class="name">'+clean(p.name)+'</span><span class="score">'+p.score+'/4<small>ACERTOS</small></span></div>'});
h+='<details class="details"><summary>📚 Ver gabarito comentado (20 perguntas)</summary>';
D.forEach((topic,ti)=>{h+='<h3 style="color:'+topic[2]+';margin:18px 0 0">'+topic[0]+' '+clean(topic[1])+'</h3>';s.results.filter(a=>a.topic===ti).forEach(a=>{const q=topic[3][a.index],p=s.players[a.player];h+='<div class="review"><b>'+clean(p.avatar)+' '+clean(p.name)+' — '+clean(q[0])+'</b><strong class="'+(a.correct?'':'miss')+'">'+(a.correct?'✓ Acertou':'✗ Errou')+' • Correta: '+("ABCD"[q[2]])+') '+clean(q[1][q[2]])+'</strong><p>'+clean(q[3])+'</p></div>'})});
h+='</details><div class="buttons"><button class="btn" data-action="again">🔀 JOGAR DE NOVO</button><button class="btn light" data-action="reset">👥 TROCAR JOGADORES</button><button class="btn secondary" data-action="share">↗ COMPARTILHAR O LINK</button></div><p class="note">Cada nova partida embaralha perguntas e turnos. Os dados ficam salvos somente neste tablet.</p></div>';wrapper(h)
}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;for(let i=0;i<24;i++){const e=document.createElement("span");e.className="confetti";e.textContent=["✨","⭐","💛","🎉","💜"][i%5];e.style.left=Math.random()*100+"vw";e.style.animationDelay=Math.random()*1.3+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}
function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
async function share(){const url=location.origin+location.pathname;try{if(navigator.share)await navigator.share({title:"Quiz Por Trás das Telas",text:"Jogue o quiz sobre redes sociais e autoestima!",url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);toast("Link copiado! 📋")}else toast("Copie o endereço na barra do navegador.")}catch(e){}}
function render(){stop();if(!s){setup();return}if(s.phase==="pass")pass();else if(s.phase==="question")question();else if(s.phase==="feedback")feedback();else if(s.phase==="result")results()}
root.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;if(a==="icon"){let i=+b.dataset.i;icons[i]=(icons[i]+1)%AN.length;b.textContent=AN[icons[i]]}else if(a==="start")start();else if(a==="ready"){s.phase="question";s.deadline=null;s.picked=null;persist();render()}else if(a==="pick"&&s.phase==="question"){s.picked=+b.dataset.i;persist();render()}else if(a==="next")next(false);else if(a==="advance")advance();else if(a==="again"){newGame(s.players.map(p=>({...p,score:0})),s.timer)}else if(a==="reset"){stop();s=null;localStorage.removeItem(KEY);setup()}else if(a==="share")share()});
try{let old=JSON.parse(localStorage.getItem(KEY)||"null");if(old&&old.version===2&&old.players?.length===5&&old.turns?.length===20&&old.position>=0&&old.position<=20&&["pass","question","feedback","result"].includes(old.phase))s=old}catch(e){}render();
})();
</script></body></html>
